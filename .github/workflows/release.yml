name: Alpha or beta release
on:
  push:
    tags: ['v*-alpha.*', 'v*-beta.*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Check tag matches package version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== `v${require("./package.json").version}`) process.exit(1)'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: homebridge-speedeo-connect-*.tgz
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-package
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-package/*.tgz
          --verify-tag --prerelease --title "$GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
